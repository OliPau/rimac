services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    ports: ['127.0.0.1:8000:8000']
    command: '-jar DynamoDBLocal.jar -inMemory -sharedDb'
  mysql:
    image: mysql:8.0
    ports: ['127.0.0.1:3307:3306']
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: appointments_pe
      MYSQL_USER: test
      MYSQL_PASSWORD: local-only-test
    volumes:
      - ./infra/migrations/001.sql:/docker-entrypoint-initdb.d/001.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 5s
      retries: 20
