name: Deploy learning
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify AWS access or deploy the verified revision
        type: choice
        required: true
        default: verify_oidc
        options:
          - verify_oidc
          - deploy
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: deploy-learning
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: learning
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      SWAGGER_SECRET_ARN: ${{ vars.SWAGGER_SECRET_ARN }}
      SQL_SECRET_PE_ARN: ${{ vars.SQL_SECRET_PE_ARN }}
      SQL_SECRET_CL_ARN: ${{ vars.SQL_SECRET_CL_ARN }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify checks for this commit
        run: pnpm exec tsx scripts/verify-analysis.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Assume the learning deploy role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Confirm AWS identity
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          test "$account" = "$AWS_ACCOUNT_ID"
          aws sts get-caller-identity --query Arn --output text
      - name: Confirm access to the artifact bucket
        run: aws s3api head-bucket --bucket "rimac-learning-learning-artifacts-$AWS_ACCOUNT_ID"
      - name: Deploy the verified revision
        if: inputs.mode == 'deploy'
        run: pnpm deploy
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      - name: Read deployed API URL
        if: inputs.mode == 'deploy'
        id: api
        run: echo "url=$(pnpm exec tsx scripts/api-url.ts)" >> "$GITHUB_OUTPUT"
      - name: Verify the deployed POST
        if: inputs.mode == 'deploy'
        run: pnpm smoke
        env:
          API_URL: ${{ steps.api.outputs.url }}
